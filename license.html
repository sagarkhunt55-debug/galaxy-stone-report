<!DOCTYPE html>
<html>
<head>
    <title>License</title>
</head>
<body style="text-align:center;margin-top:120px;">

<h2>Enter License Key</h2>

<input id="key" style="padding:10px;width:300px;" />
<br><br>

<button onclick="sendKey()">Activate</button>

<script>
const { ipcRenderer } = require('electron');

function sendKey() {
    const key = document.getElementById("key").value;
    ipcRenderer.send("check-license", key);
}
</script>

</body>
</html>
